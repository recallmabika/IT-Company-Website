<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | TechVenture Solutions</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="./css/careers.css">
    <link rel="icon" href="./images/image.png">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="./images/image.png" alt="Company Logo"></a>
        <div class="fas fa-bars" id="menu-btn"></div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html#home">home</a></li>
                <li><a href="index.html#about">about</a></li>
                <li><a href="index.html#service">services</a></li>
                <li><a href="index.html#portfolio">portfolio</a></li>
                <li><a href="careers.html" class="active">career</a></li>
                <li><a href="index.html#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="career-hero d-flex align-items-center justify-content-center">
        <div class="text-center">
            <h2 class="display-4 text-white">Join Our Team</h2>
            <p class="lead text-white-50">Home / Careers</p>
        </div>
    </section>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="career-card shadow-lg p-4 p-md-5">
                    <div class="text-center mb-5">
                        <h1 class="heading">Open Positions</h1>
                        <p class="text-muted">We are looking for passionate innovators to build the future.</p>
                    </div>

                    <form action="./careers.php" method="POST" enctype="multipart/form-data" id="applicationForm">
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Full Name</label>
                                <input type="text" name="name" class="form-control custom-input" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Phone Number</label>
                                <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control custom-input" placeholder="07XXXXXXXX" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" class="form-control custom-input" placeholder="name@example.com" required>
                        </div>

                        <div class="form-group mt-4">
                            <label class="d-block mb-3 font-weight-bold">Apply For Which Post?</label>
                            <div class="role-grid">
                                <label class="role-option">
                                    <input type="radio" name="status" value="Web Developer" checked>
                                    <div class="role-box">
                                        <i class="fas fa-code"></i>
                                        <span>Web Developer</span>
                                    </div>
                                </label>
                                <label class="role-option">
                                    <input type="radio" name="status" value="Mobile Developer">
                                    <div class="role-box">
                                        <i class="fas fa-mobile-alt"></i>
                                        <span>Mobile Developer</span>
                                    </div>
                                </label>
                                <label class="role-option">
                                    <input type="radio" name="status" value="Cybersecurity">
                                    <div class="role-box">
                                        <i class="fas fa-user-shield"></i>
                                        <span>Cybersecurity Analyst</span>
                                    </div>
                                </label>
                                <label class="role-option">
                                    <input type="radio" name="status" value="Digital Marketer">
                                    <div class="role-box">
                                        <i class="fas fa-ad"></i>
                                        <span>Digital Marketer</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div class="form-group mt-4">
                            <label>Years of Relevant Experience</label>
                            <input type="number" name="experience" min="0" max="40" class="form-control custom-input" placeholder="0" required>
                        </div>

                        <div class="form-group">
                            <label>Professional Summary / Other Details</label>
                            <textarea name="details" class="form-control custom-input" rows="4" placeholder="Tell us about your key skills..." required></textarea>
                        </div>

                        <div class="upload-zone mt-4" id="drop-area">
                            <i class="fas fa-cloud-upload-alt fa-3x mb-3 text-primary"></i>
                            <h5>Upload Your Resume</h5>
                            <p class="text-muted small">PDF, DOC, or DOCX (Max 5MB)</p>
                            <input type="file" name="fileToUpload" id="fileElem" accept=".pdf,.doc,.docx" class="d-none" required>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('fileElem').click()">Browse Files</button>
                            <div id="file-name" class="mt-2 font-weight-bold text-success"></div>
                        </div>

                        <div class="text-center mt-5">
                            <button type="submit" name="submit" class="btn btn-primary btn-lg px-5 shadow">Submit Application</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer mt-5">
        <div class="container text-center py-4">
            <p class="mb-0">&copy; 2026 IT Company Website. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple script to show selected file name
        const fileInput = document.getElementById('fileElem');
        const fileNameDisplay = document.getElementById('file-name');

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileNameDisplay.textContent = "Selected: " + this.files[0].name;
            }
        });
    </script>
</body>
</html>
